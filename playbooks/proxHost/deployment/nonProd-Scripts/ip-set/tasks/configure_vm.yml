# ── Step 1: Enable agent and reboot VM ───────────────────────────────────

- name: "VMID {{ vm.vmid }} | Enable QEMU guest agent in config"
  shell: qm set {{ vm.vmid }} --agent enabled=1
  changed_when: true

- name: "VMID {{ vm.vmid }} | Check current status"
  shell: qm status {{ vm.vmid }}
  register: vm_status
  changed_when: false

- name: "VMID {{ vm.vmid }} | Reboot VM to attach virtio agent channel"
  shell: qm reboot {{ vm.vmid }}
  when: "'running' in vm_status.stdout"

- name: "VMID {{ vm.vmid }} | Wait for shutdown to begin"
  pause:
    seconds: 15
  when: "'running' in vm_status.stdout"

- name: "VMID {{ vm.vmid }} | Start VM if stopped"
  shell: qm start {{ vm.vmid }}
  when: "'running' not in vm_status.stdout"

# ── Step 2: Wait for guest agent ─────────────────────────────────────────

- name: "VMID {{ vm.vmid }} | Wait for guest agent"
  shell: qm agent {{ vm.vmid }} ping
  register: agent_ping
  until: agent_ping.rc == 0
  retries: "{{ (agent_timeout | int) // (agent_poll_interval | int) }}"
  delay: "{{ agent_poll_interval }}"
  changed_when: false
  failed_when: false

- name: "VMID {{ vm.vmid }} | Set agent availability"
  set_fact:
    agent_available: "{{ agent_ping.rc == 0 }}"

- name: "VMID {{ vm.vmid }} | Warn if agent unavailable"
  debug:
    msg: "WARNING: Guest agent not responding on VM {{ vm.vmid }} — skipping"
  when: not (agent_available | bool)

# ── Step 3: Get OS info ──────────────────────────────────────────────────

- name: "VMID {{ vm.vmid }} | Get OS info"
  shell: qm agent {{ vm.vmid }} get-osinfo
  register: osinfo_raw
  changed_when: false
  failed_when: false
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Debug OS info"
  debug:
    msg: "OS info raw: {{ osinfo_raw.stdout | default('empty') }}"
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Parse OS info"
  set_fact:
    os_info: "{{ (osinfo_raw.stdout | default('{}') | from_json).get('result', osinfo_raw.stdout | default('{}') | from_json) }}"
  when: agent_available | bool
  failed_when: false

- name: "VMID {{ vm.vmid }} | Determine OS type"
  set_fact:
    os_id: "{{ os_info.get('id', '') | default('') | lower }}"
    os_name: "{{ (os_info.get('pretty-name', '') or os_info.get('name', '') or os_info.get('id', '') or 'unknown') | lower }}"
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Show detected OS"
  debug:
    msg: "Detected OS: {{ os_name }} (id: {{ os_id }})"
  when: agent_available | bool

# ── Step 4: Get network interfaces and match MAC ────────────────────────

- name: "VMID {{ vm.vmid }} | Get guest network interfaces"
  shell: qm agent {{ vm.vmid }} network-get-interfaces
  register: netifaces_raw
  changed_when: false
  failed_when: false
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Debug network interfaces"
  debug:
    msg: "Network interfaces raw: {{ netifaces_raw.stdout | default('empty') }}"
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Parse network interfaces"
  set_fact:
    iface_list: "{{ (netifaces_raw.stdout | default('[]') | from_json) if (netifaces_raw.stdout | default('') | from_json) is iterable and (netifaces_raw.stdout | default('{}') | from_json) is not mapping else (netifaces_raw.stdout | default('{}') | from_json).get('result', []) }}"
  when: agent_available | bool
  failed_when: false

- name: "VMID {{ vm.vmid }} | Debug parsed interface list"
  debug:
    msg: "Parsed {{ iface_list | length }} interfaces: {{ iface_list | map(attribute='name') | list }}"
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Match interface by MAC {{ vm.mac }}"
  set_fact:
    guest_iface: "{{ iface_list | selectattr('hardware-address', 'defined') | selectattr('hardware-address', 'match', '(?i)' + vm.mac) | map(attribute='name') | first | default('') }}"
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Show matched interface"
  debug:
    msg: "Matched interface: '{{ guest_iface }}' for MAC {{ vm.mac }}"
  when: agent_available | bool

- name: "VMID {{ vm.vmid }} | Warn if no interface matched"
  debug:
    msg: "WARNING: No interface matched MAC {{ vm.mac }} on VM {{ vm.vmid }} — skipping IP assignment"
  when: agent_available | bool and (guest_iface | length == 0)

# ── Step 5: Assign IP based on OS type ───────────────────────────────────
#
# pvesh --command takes ONLY the executable path (not a JSON array).
# The actual script is piped via --input-data (guest agent stdin).
# --output-format json ensures pvesh returns parseable JSON.
# {% raw %} prevents Jinja2 from eating Python f-string braces.

- name: "VMID {{ vm.vmid }} | Assign {{ vm.assigned_ip }}/{{ vm.assigned_prefix }} via guest agent"
  when: agent_available | bool and (guest_iface | length > 0)
  shell: |
    {% raw %}python3 << 'PYEOF'
    import json, os, subprocess, sys, time

    VMID      = os.environ['VMID']
    IP        = os.environ['IP']
    PREFIX    = int(os.environ['PREFIX'])
    GATEWAY   = os.environ['GATEWAY']
    DNS       = os.environ['DNS'].split()
    IFACE     = os.environ['GUEST_IFACE']
    OS_NAME   = os.environ['OS_NAME']
    OS_ID     = os.environ['OS_ID']

    NODE = subprocess.run(
        ["hostname"], capture_output=True, text=True
    ).stdout.strip()

    print(f"Node: {NODE}, VMID: {VMID}, Iface: {IFACE}, OS: {OS_NAME}")

    # ── Helper: run a shell script inside the guest via stdin ────────────
    #
    # pvesh --command takes ONLY the executable path (not a JSON array).
    # The actual script is piped via --input-data (guest agent stdin).

    def guest_exec(script, shell="/bin/sh", timeout=30):
        """Execute a script inside the guest. Script is sent via stdin."""
        print(f"  guest_exec [{shell}]: {script[:120]}...")
        r = subprocess.run(
            ["pvesh", "create",
             f"/nodes/{NODE}/qemu/{VMID}/agent/exec",
             "--command", shell,
             "--input-data", script,
             "--output-format", "json"],
            capture_output=True, text=True
        )
        if r.returncode != 0:
            print(f"  [FAILED rc={r.returncode}]: {r.stderr.strip()}")
            return ""
        try:
            pid = json.loads(r.stdout)['pid']
        except Exception as e:
            print(f"  [parse error]: stdout={r.stdout!r} err={e}")
            return ""

        deadline = time.time() + timeout
        while time.time() < deadline:
            s = subprocess.run(
                ["pvesh", "get",
                 f"/nodes/{NODE}/qemu/{VMID}/agent/exec-status",
                 "--pid", str(pid),
                 "--output-format", "json"],
                capture_output=True, text=True
            )
            try:
                d = json.loads(s.stdout)
                if d.get('exited'):
                    err = d.get('err-data', '').strip()
                    out = d.get('out-data', '').strip()
                    exitcode = d.get('exitcode', -1)
                    if err:
                        print(f"  [guest stderr]: {err}")
                    if exitcode != 0:
                        print(f"  [guest exitcode]: {exitcode}")
                    if out:
                        print(f"  [guest stdout]: {out}")
                    return out
            except Exception:
                pass
            time.sleep(1)
        print(f"  [TIMEOUT after {timeout}s]")
        return ""

    def guest_exec_win(script, timeout=30):
        """Execute a cmd.exe script inside a Windows guest via stdin."""
        return guest_exec(script + "\r\nexit\r\n", shell="cmd.exe", timeout=timeout)

    dns_str = " ".join(DNS)

    # ── Windows (all editions incl. Home) ───────────────────────────────
    # Uses netsh via cmd.exe — works on Home, Pro, and Server.
    if "windows" in OS_NAME or "windows" in OS_ID:
        print("Method: Windows netsh (cmd.exe)")
        mask_int = (0xFFFFFFFF << (32 - PREFIX)) & 0xFFFFFFFF
        mask = ".".join(
            str((mask_int >> (8 * i)) & 0xFF) for i in reversed(range(4))
        )
        guest_exec_win(
            f'netsh interface ip set address name="{IFACE}" static {IP} {mask} {GATEWAY}')
        guest_exec_win(
            f'netsh interface ip set dns name="{IFACE}" static {DNS[0]}')
        for i, ds in enumerate(DNS[1:], start=2):
            guest_exec_win(
                f'netsh interface ip add dns name="{IFACE}" {ds} index={i}')

    # ── VyOS (rolling 2025+) ───────────────────────────────────────────
    elif "vyos" in OS_NAME or "vyos" in OS_ID:
        print("Method: VyOS configure/set/commit")
        vyos_script = "\n".join([
            "#!/bin/vbash",
            "source /opt/vyatta/etc/functions/script-template",
            # Detect WAN interface and capture its MAC before entering configure mode
            f"WAN_IFACE=$(ls /sys/class/net/ | grep -E '^eth[0-9]+$' | grep -v '^{IFACE}$' | sort | head -1)",
            "WAN_MAC=$(cat /sys/class/net/$WAN_IFACE/address 2>/dev/null)",
            "configure",
            # LAN interface (vmbr5) — static IP as the LAN gateway
            f"delete interfaces ethernet {IFACE} address",
            f"set interfaces ethernet {IFACE} address {IP}/{PREFIX}",
            # WAN interface — hw-id binds VyOS to the physical NIC on fresh clones,
            # then DHCP is set without a preceding delete (avoids corrupted node on unconfigured interfaces)
            "set interfaces ethernet $WAN_IFACE hw-id $WAN_MAC",
            "set interfaces ethernet $WAN_IFACE address dhcp",
            # DNS forwarding — listen on LAN, forward to whatever DNS WAN gets via DHCP
            f"set service dns forwarding listen-address {IP}",
            "set service dns forwarding allow-from 10.10.10.0/24",
            "set service dns forwarding dhcp $WAN_IFACE",
            # NAT masquerade — so LAN clients can reach the WAN
            "set nat source rule 100 outbound-interface name $WAN_IFACE",
            "set nat source rule 100 source address 10.10.10.0/24",
            "set nat source rule 100 translation address masquerade",
            "commit",
            "save",
            "exit",
        ]) + "\n"
        guest_exec(vyos_script, shell="/bin/vbash", timeout=90)

    # ── RHEL / Rocky / Alma / CentOS ────────────────────────────────────
    elif any(x in OS_NAME or x in OS_ID
             for x in ("rhel", "centos", "rocky", "alma", "fedora")):
        print("Method: RHEL nmcli")
        con = "vmbr5-static"
        nmcli_script = (
            f"nmcli con delete '{con}' 2>/dev/null || true\n"
            f"nmcli con add type ethernet con-name '{con}' ifname {IFACE}"
            f" ip4 {IP}/{PREFIX} gw4 {GATEWAY}\n"
            f"nmcli con mod '{con}' ipv4.dns '{dns_str}'\n"
            f"nmcli con mod '{con}' ipv4.method manual\n"
            f"nmcli con up '{con}'\n"
        )
        guest_exec(nmcli_script)

    # ── Debian / Ubuntu ─────────────────────────────────────────────────
    else:
        netplan_check = guest_exec(
            "ls /etc/netplan/*.yaml 2>/dev/null | head -1"
        ).strip()

        if netplan_check:
            print("Method: Debian/Ubuntu netplan")
            import base64
            cfg = (
                "network:\n"
                "  version: 2\n"
                "  ethernets:\n"
                f"    {IFACE}:\n"
                "      dhcp4: false\n"
                f"      addresses: [{IP}/{PREFIX}]\n"
                "      routes:\n"
                "        - to: default\n"
                f"          via: {GATEWAY}\n"
                "      nameservers:\n"
                f"        addresses: [{', '.join(DNS)}]\n"
            )
            b64 = base64.b64encode(cfg.encode()).decode()
            guest_exec(
                f"echo '{b64}' | base64 -d > /etc/netplan/60-vmbr5.yaml\n"
                "netplan apply\n"
            )
        else:
            print("Method: Debian/Ubuntu /etc/network/interfaces")
            import base64
            stanza = (
                f"\nauto {IFACE}\n"
                f"iface {IFACE} inet static\n"
                f"    address {IP}/{PREFIX}\n"
                f"    gateway {GATEWAY}\n"
                f"    dns-nameservers {dns_str}\n"
            )
            b64 = base64.b64encode(stanza.encode()).decode()
            guest_exec(
                f"sed -i '/^auto {IFACE}/,/^$/d' /etc/network/interfaces 2>/dev/null || true\n"
                f"echo '{b64}' | base64 -d >> /etc/network/interfaces\n"
                f"ifdown {IFACE} 2>/dev/null || true\n"
                f"ifup {IFACE} 2>/dev/null || "
                f"(ip addr flush dev {IFACE}; ip addr add {IP}/{PREFIX} dev {IFACE}; "
                f"ip link set {IFACE} up; "
                f"ip route add default via {GATEWAY} dev {IFACE} 2>/dev/null || true)\n"
            )

    print(f"DONE: {IP}/{PREFIX} assigned to VMID {VMID} on {IFACE}")
    PYEOF{% endraw %}
  environment:
    VMID:        "{{ vm.vmid }}"
    IP:          "{{ vm.assigned_ip }}"
    PREFIX:      "{{ vm.assigned_prefix }}"
    GATEWAY:     "{{ gateway }}"
    DNS:         "{{ dns_servers | join(' ') }}"
    GUEST_IFACE: "{{ guest_iface }}"
    OS_NAME:     "{{ os_name | default('unknown') }}"
    OS_ID:       "{{ os_id | default('') }}"
  register: assign_result
  changed_when: true

- name: "VMID {{ vm.vmid }} | Show assignment output"
  debug:
    msg: "{{ assign_result.stdout_lines | default(['no output']) }}"
  when: agent_available | bool and (guest_iface | default('') | length > 0)

