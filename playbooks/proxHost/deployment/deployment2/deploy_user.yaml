###########################################################################
# TUNABLE CLONE SETTINGS (override in deployment2.yaml vars or -e flag)
#   clone_throttle: 2   — clones running at once (2 = fast default)
#   clone_retries:  3   — retry attempts on CFS lock timeout
#   clone_delay:    2   — seconds between retries
###########################################################################

###########################################################################
# POOL CREATION
###########################################################################

- name: Check if pool exists
  ansible.builtin.shell: |
    pvesh get /pools/Deployment2_{{ current_user.name }} --noborder 1
  register: pool_check
  failed_when: false
  changed_when: false
  delegate_to: "{{ template_node }}"

- name: Create pool if it doesn't exist
  ansible.builtin.shell: |
    pvesh create /pools \
      --poolid Deployment2_{{ current_user.name }} \
      --comment "Deployment 2 environment for {{ current_user.name }}"
  when: pool_check.rc != 0
  delegate_to: "{{ template_node }}"

###########################################################################
# NETWORK BRIDGE LOGIC (IDEMPOTENT)
###########################################################################

- name: Check if IP already exists anywhere on node
  ansible.builtin.shell: |
    ip -4 -o addr show | awk '{print $4}' | grep -qx "{{ current_user.bridge_ip }}{{ bridge_cidr }}"
  register: ip_exists
  failed_when: false
  changed_when: false
  delegate_to: "{{ proxmox_target_host }}"

- name: Find interface that already owns the IP
  ansible.builtin.shell: |
    ip -4 -o addr show | awk '$4=="{{ current_user.bridge_ip }}{{ bridge_cidr }}" {print $2}'
  register: ip_iface
  failed_when: false
  changed_when: false
  delegate_to: "{{ proxmox_target_host }}"

- name: Find next available vmbrX (only if IP unused)
  ansible.builtin.shell: |
    for i in $(seq 0 99); do
      if ! ip link show vmbr$i >/dev/null 2>&1; then
        echo vmbr$i
        exit 0
      fi
    done
    exit 1
  args:
    executable: /bin/bash
  register: next_bridge
  when: ip_exists.rc != 0
  delegate_to: "{{ proxmox_target_host }}"

- name: Set bridge_name fact
  ansible.builtin.set_fact:
    bridge_name: >-
      {{ (ip_iface.stdout | trim) if ip_exists.rc == 0 else (next_bridge.stdout | trim) }}

- name: Show selected bridge
  ansible.builtin.debug:
    msg: "Using {{ bridge_name }} for {{ current_user.bridge_ip }}{{ bridge_cidr }}"

- name: Create bridge config block (only if IP unused)
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED {{ bridge_name }}"
    block: |
      auto {{ bridge_name }}
      iface {{ bridge_name }} inet static
        address {{ current_user.bridge_ip }}
        netmask {{ bridge_netmask }}
        bridge-ports none
        bridge-stp off
        bridge-fd 0
  when: ip_exists.rc != 0
  delegate_to: "{{ proxmox_target_host }}"

- name: Bring up bridge (only if created)
  ansible.builtin.shell: |
    ifup {{ bridge_name }}
  when: ip_exists.rc != 0
  delegate_to: "{{ proxmox_target_host }}"

- name: Verify bridge IP
  ansible.builtin.shell: |
    ip -4 -o addr show dev {{ bridge_name }} | awk '{print $4}' | grep -qx "{{ current_user.bridge_ip }}{{ bridge_cidr }}"
  register: bridge_verify
  failed_when: bridge_verify.rc != 0
  changed_when: false
  delegate_to: "{{ proxmox_target_host }}"

###########################################################################
# BUILD VM LIST WITH COUNT EXPANSION
###########################################################################

- name: Reset user_vms for this user
  ansible.builtin.set_fact:
    user_vms: []

- name: Expand VM definitions by count
  include_tasks: expand_vm.yaml
  loop: "{{ current_user.vms }}"
  loop_control:
    loop_var: vm_def

###########################################################################
# VMID ALLOCATION
###########################################################################

- name: Get used VMIDs on target node
  ansible.builtin.shell: |
    qm list | awk 'NR>1 {print $1}'
  register: used_vmids_target
  changed_when: false
  delegate_to: "{{ proxmox_target_host }}"

- name: Get used VMIDs on template node
  ansible.builtin.shell: |
    qm list | awk 'NR>1 {print $1}'
  register: used_vmids_template
  changed_when: false
  delegate_to: "{{ template_node }}"

- name: Build combined used VMID list
  ansible.builtin.set_fact:
    used_vmids: >-
      {{
        (used_vmids_target.stdout_lines + used_vmids_template.stdout_lines)
        | map('int') | unique | list
      }}

- name: Build free VMID list in range
  ansible.builtin.set_fact:
    free_vmids: "{{ range(vmid_start, vmid_end + 1) | reject('in', used_vmids) | list }}"

- name: Verify sufficient free VMIDs (VMs + VyOS)
  ansible.builtin.fail:
    msg: "Not enough free VMIDs. Need {{ user_vms | length + 1 }}, found {{ free_vmids | length }}"
  when: free_vmids | length < user_vms | length + 1

# VyOS gets free_vmids[0], regular VMs start from free_vmids[1]
- name: Set VyOS VMID
  ansible.builtin.set_fact:
    vyos_vmid: "{{ free_vmids[0] }}"

- name: Attach VMIDs to VM plan
  ansible.builtin.set_fact:
    vm_plan: "{{ vm_plan | default([]) + [ item | combine({'new_vmid': free_vmids[idx + 1]}) ] }}"
  loop: "{{ user_vms }}"
  loop_control:
    index_var: idx

###########################################################################
# BUILD SINGLE CLONE LIST (VyOS + all regular VMs in one shot)
###########################################################################

- name: Start clone list with VyOS
  ansible.builtin.set_fact:
    clone_list:
      - src_vmid: "3008"
        new_vmid: "{{ vyos_vmid }}"
        name: "VyOS-{{ current_user.name }}"

- name: Add regular VMs to clone list
  ansible.builtin.set_fact:
    clone_list: "{{ clone_list + [{'src_vmid': item.vmid | string, 'new_vmid': item.new_vmid | string, 'name': item.name}] }}"
  loop: "{{ vm_plan }}"

###########################################################################
# PHASE 1: CLONE EVERYTHING FIRST (VyOS + all VMs in one throttled loop)
###########################################################################

- name: "CLONE ALL: {{ item.name }} ({{ item.src_vmid }} -> {{ item.new_vmid }})"
  ansible.builtin.shell: |
    if qm status {{ item.new_vmid }} >/dev/null 2>&1; then
      echo "SKIP: {{ item.name }} already exists"
      exit 0
    fi
    qm clone "{{ item.src_vmid }}" "{{ item.new_vmid }}" \
      --name "{{ item.name }}" \
      --target "{{ proxmox_target_node }}" \
      --full 0 2>&1
  register: clone_result
  until: >-
    clone_result.rc == 0 or
    'already exists' in (clone_result.stdout | default(''))
  retries: "{{ clone_retries | default(3) }}"
  delay: "{{ clone_delay | default(3) }}"
  failed_when: >-
    clone_result.rc != 0 and
    'already exists' not in (clone_result.stdout | default('')) and
    'already exists' not in (clone_result.stderr | default(''))
  loop: "{{ clone_list }}"
  throttle: "{{ clone_throttle | default(3) }}"
  delegate_to: "{{ template_node }}"

###########################################################################
# PHASE 2: CONFIGURE EVERYTHING IN PARALLEL (all at once, no waiting)
###########################################################################

# VyOS config — runs immediately, no waiting on regular VMs
- name: Configure VyOS (remove inherited NICs + set resources)
  ansible.builtin.shell: |
    for nic in $(qm config {{ vyos_vmid }} | grep -oP '^net\d+'); do
      qm set {{ vyos_vmid }} --delete $nic
    done
    qm set "{{ vyos_vmid }}" \
      --cores {{ vyos_cores }} \
      --memory {{ vyos_memory }} \
      --net0 "virtio,bridge={{ wan_bridge }}" \
      --net1 "virtio,bridge={{ bridge_name }}"
  async: 120
  poll: 0
  register: vyos_config_job
  delegate_to: "{{ proxmox_target_host }}"

# Regular VM config — all fired in parallel
- name: Configure all VMs — CPU / RAM / NET (parallel)
  ansible.builtin.shell: |
    qm set "{{ item.new_vmid }}" \
      --cores "{{ item.cores | int }}" \
      --memory "{{ item.memory | int }}" \
      --net0 "virtio,bridge={{ bridge_name }}"
  loop: "{{ vm_plan }}"
  async: 120
  poll: 0
  register: config_jobs
  delegate_to: "{{ proxmox_target_host }}"

# TPM fixes — all fired in parallel
- name: Fix TPM storage on all VMs (parallel)
  ansible.builtin.shell: |
    if qm config {{ item.new_vmid }} | grep -q '^tpmstate0:'; then
      qm set {{ item.new_vmid }} --tpmstate0 local-lvm:1
    fi
  loop: "{{ vm_plan }}"
  async: 120
  poll: 0
  register: tpm_jobs
  delegate_to: "{{ proxmox_target_host }}"

###########################################################################
# PHASE 2b: WAIT FOR ALL CONFIG TO COMPLETE
###########################################################################

- name: Wait for VyOS config
  ansible.builtin.async_status:
    jid: "{{ vyos_config_job.ansible_job_id }}"
  register: vyos_config_result
  until: vyos_config_result.finished
  retries: 30
  delay: 3
  delegate_to: "{{ proxmox_target_host }}"

- name: Wait for all VM configs
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ config_jobs.results }}"
  register: config_results
  until: config_results.finished
  retries: 30
  delay: 3
  delegate_to: "{{ proxmox_target_host }}"

- name: Wait for all TPM fixes
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ tpm_jobs.results }}"
  register: tpm_results
  until: tpm_results.finished
  retries: 30
  delay: 3
  delegate_to: "{{ proxmox_target_host }}"

###########################################################################
# PHASE 3: ADD TO POOL (one command)
###########################################################################

- name: Build comma-separated VMID list for pool
  ansible.builtin.set_fact:
    all_vmids_csv: "{{ ([vyos_vmid | string] + vm_plan | map(attribute='new_vmid') | map('string') | list) | join(',') }}"

- name: Add all VMs to pool in one batch
  ansible.builtin.shell: |
    pvesh set /pools/Deployment2_{{ current_user.name }} --vms {{ all_vmids_csv }}
  delegate_to: "{{ template_node }}"

###########################################################################
# CLEAR VARS FOR NEXT USER
###########################################################################

- name: Clear variables for next user
  ansible.builtin.set_fact:
    vm_plan: []
    user_vms: []
    vyos_vmid: ""
    clone_list: []
