---
- name: Expand VMs for  {{ current_user.name }}
  ansible.builtin.set_fact:
    user_vms: >-
      {{
        user_vms + [{
          'name': vm_def.template
                  + (('-' + (instance_idx + 1) | string) if vm_def.count | default(1) | int > 1 else '')
                  + '-' + current_user.name,
          'vmid':     templates[vm_def.template].vmid,
          'cores':    templates[vm_def.template].cores,
          'memory':   templates[vm_def.template].memory,
          'nic_type': templates[vm_def.template].nic_type
        }]
      }}
  loop: "{{ range(0, vm_def.count | default(1) | int) | list }}"
  loop_control:
    loop_var: instance_idx
